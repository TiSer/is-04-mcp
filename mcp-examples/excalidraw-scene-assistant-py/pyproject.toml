[project]
name = "excalidraw-scene-assistant-mcp"
version = "0.1.0"
description = "MCP server for scene-aware Excalidraw analysis"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.12.0"]

[project.scripts]
excalidraw-scene-assistant-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
